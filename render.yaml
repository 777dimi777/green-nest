services:
  - type: web
    name: green-nest-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci && npm run build && npm run prisma:migrate:deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
